# Production overrides — used on VPS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires Docker Compose >= 2.24.4 (for the !override / !reset tags).

# Prod-safe shared bits: production deps only (no dev), production settings,
# .env.prod only, and NO source bind mount (image code is authoritative).
x-prod-app: &prod-app
  build:
    context: .
    args:
      INSTALL_DEV: "false"
  restart: always
  volumes: !override []                    # drop the dev `.:/app` bind mount
  environment: !override
    - DJANGO_SETTINGS_MODULE=config.settings.production
  env_file: !override
    - .env.prod

services:

  web:
    <<: *prod-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes: !override
      - static_volume:/app/staticfiles    # share collected static with nginx
    ports: !reset []                        # nginx fronts it; no direct host port
    expose:
      - "8000"

  celery-critical:
    <<: *prod-app
    command: celery -A config worker -Q critical -c 2 -n critical@%h --loglevel=warning

  celery-high:
    <<: *prod-app
    command: celery -A config worker -Q high -c 3 -n high@%h --loglevel=warning

  celery-default:
    <<: *prod-app
    command: celery -A config worker -Q default,low -c 2 -n default@%h --loglevel=warning

  celery-beat:
    <<: *prod-app
    command: celery -A config beat -l warning --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    image: nginx:1.27-alpine
    container_name: football_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  static_volume:
  certbot_certs:
