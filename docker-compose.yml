# Dev environment — hot-reload (bind mount), exposed ports, dev deps baked in.
# Usage: docker compose up

# Shared build + config for every service that runs the app image.
# Anchors keep the 6 app services DRY — change once, applies everywhere.
x-app-build: &app-build
  build:
    context: .
    args:
      INSTALL_DEV: "true"

x-app-common: &app-common
  <<: *app-build
  restart: unless-stopped
  volumes:
    - .:/app                      # bind mount = live code reload in dev
  environment:
    - DJANGO_SETTINGS_MODULE=config.settings.development
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: football_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_intel
      POSTGRES_USER: football_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_user -d football_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: football_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app-common
    container_name: football_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  celery-critical:
    <<: *app-common
    container_name: football_celery_critical
    command: celery -A config worker -Q critical -c 2 -n critical@%h --loglevel=info

  celery-high:
    <<: *app-common
    container_name: football_celery_high
    command: celery -A config worker -Q high -c 3 -n high@%h --loglevel=info

  celery-default:
    <<: *app-common
    container_name: football_celery_default
    command: celery -A config worker -Q default,low -c 2 -n default@%h --loglevel=info

  celery-beat:
    <<: *app-common
    container_name: football_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
